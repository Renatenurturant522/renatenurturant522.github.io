name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          AEC5E2: ${{ secrets.AEC5E2 }}
          B77705: ${{ secrets.B77705 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('AEC5E2', '')
          k2 = os.environ.get('B77705', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- b9cb892cc58445e3a70f7d831c -->', k1) if k1 else txt
          out = out.replace('<!-- 779fa2809d474f33dedec6f0 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
